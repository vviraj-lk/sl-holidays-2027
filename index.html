
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ශ්‍රී ලංකා 2027 නිවාඩු</title>
    <!-- Makes it behave like a real App on mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen select-none">
    
    <!-- App Container -->
    <div class="max-w-md mx-auto bg-slate-950 min-h-screen shadow-2xl flex flex-col">
        
        <!-- App Header -->
        <div class="bg-indigo-900 p-4 pt-8 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-white">ශ්‍රී ලංකා 2027 නිවාඩු</h1>
            <p class="text-xs text-indigo-200 mt-1">Sri Lanka Official Holiday Calendar</p>
            
            <!-- Search Input -->
            <div class="mt-3">
                <input type="text" id="searchInput" placeholder="🔍 නිවාඩු දිනයක් සොයන්න..." 
                    class="w-full bg-indigo-950 text-white text-sm px-3 py-2 rounded-lg border border-indigo-700 focus:outline-none focus:border-white">
            </div>
        </div>

        <!-- Notice -->
        <div class="p-3 bg-amber-950 border-b border-amber-800 text-amber-200 text-xs">
            ⚠️ සියලුම සෙනසුරාදා සහ ඉරිදා දිනයන් බැංකු නිවාඩු (B) ලෙස සැලකේ.
        </div>

        <!-- Holiday List -->
        <div id="holidayList" class="p-3 space-y-2.5 flex-1 overflow-y-auto pb-6">
            <!-- Items will load here -->
        </div>

        <!-- App Footer Nav -->
        <div class="bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-400">
            B: Bank | P: Public | M: Mercantile
        </div>
    </div>

    <script>
        const holidays = [
            { date: '15 January, Friday', name: 'Tamil Thai Pongal Day', si: 'දෙමළ තෛයිපොංගල් දිනය', type: 'B, P, M' },
            { date: '22 January, Friday', name: 'Duruthu Full Moon Poya Day', si: 'දුරුතු පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '04 February, Thursday', name: 'Independence Day', si: 'නිදහස් දිනය', type: 'B, P, M' },
            { date: '20 February, Saturday', name: 'Navam Full Moon Poya Day', si: 'නවම් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '06 March, Saturday', name: 'Mahasivarathri Day', si: 'මහා ශිවරාත්‍රී දිනය', type: 'B, P' },
            { date: '10 March, Wednesday', name: 'Eid-Ul-Fitr (Ramazan Festival Day)', si: 'රුමසාන් උත්සව දිනය', type: 'B, P' },
            { date: '22 March, Monday', name: 'Medin Full Moon Poya Day', si: 'මැදින් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '26 March, Friday', name: 'Good Friday', si: 'මහ සිකුරාදා දිනය', type: 'B, P' },
            { date: '13 April, Tuesday', name: 'Day prior to Sinhala & Tamil New Year Day', si: 'අලුත් අවුරුදු දිනයට පෙර දිනය', type: 'B, P, M' },
            { date: '14 April, Wednesday', name: 'Sinhala & Tamil New Year Day', si: 'සිංහල හා දෙමළ අලුත් අවුරුදු දිනය', type: 'B, P, M' },
            { date: '20 April, Tuesday', name: 'Bak Full Moon Poya Day', si: 'බක් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '01 May, Saturday', name: 'May Day (International Workers’ Day)', si: 'මැයි දිනය (කම්කරු දිනය)', type: 'B, P, M' },
            { date: '17 May, Monday', name: 'Eid-Ul-Allha (Hadji Festival Day)', si: 'හජ්ජි උත්සව දිනය', type: 'B, P' },
            { date: '19 May, Wednesday', name: 'Vesak Full Moon Poya Day', si: 'වෙසක් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '20 May, Thursday', name: 'Day following Vesak Full Moon Poya Day', si: 'වෙසක් පෝය දිනයට පසු දිනය', type: 'B, P, M' },
            { date: '18 June, Friday', name: 'Poson Full Moon Poya Day', si: 'පොසොන් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '18 July, Sunday', name: 'Esala Full Moon Poya Day', si: 'ඇසළ පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '15 August, Sunday', name: 'Milad-Un-Nabi (Holy Prophet\'s Birthday)', si: 'නබිතුමාගේ උපන් දිනය', type: 'B, P, M' },
            { date: '16 August, Monday', name: 'Nikini Full Moon Poya Day', si: 'නිකිණි පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '15 September, Wednesday', name: 'Binara Full Moon Poya Day', si: 'බිනර පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '15 October, Friday', name: 'Vap Full Moon Poya Day', si: 'වප් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '28 October, Thursday', name: 'Deepawali Festival Day', si: 'දීපාවලි උත්සව දිනය', type: 'B, P' },
            { date: '13 November, Saturday', name: 'Ill Full Moon Poya Day', si: 'ඉල් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '13 December, Monday', name: 'Unduwap Full Moon Poya Day', si: 'උඳුවප් පුර පසළොස්වක පෝය දිනය', type: 'B, P' },
            { date: '25 December, Saturday', name: 'Christmas Day', si: 'නත්තල් දිනය', type: 'B, P, M' }
        ];

        const listContainer = document.getElementById('holidayList');
        const searchInput = document.getElementById('searchInput');

        function renderList(filter = '') {
            listContainer.innerHTML = '';
            const filtered = holidays.filter(h => 
                h.name.toLowerCase().includes(filter.toLowerCase()) || 
                h.si.includes(filter) || 
                h.date.toLowerCase().includes(filter.toLowerCase())
            );

            if(filtered.length === 0) {
                listContainer.innerHTML = '<p class=\"text-center text-slate-500 py-6 text-sm\">කිසිදු නිවාඩු දිනයක් හමු නොවීය</p>';
                return;
            }

            filtered.forEach(h => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center shadow-sm';
                item.innerHTML = `
                    <div>
                        <div class="text-xs font-semibold text-indigo-400">${h.date}</div>
                        <div class="text-sm font-bold text-white mt-0.5">${h.name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${h.si}</div>
                    </div>
                    <div class="bg-indigo-950 border border-indigo-800 text-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                        ${h.type}
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderList(e.target.value);
        });

        renderList();
    </script>
</body>
</html>  
</html>
