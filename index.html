<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ශ්‍රී ලංකා 2027 නිවාඩු දින දර්ශනය</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen select-none">
    
    <div class="max-w-md mx-auto bg-slate-950 min-h-screen shadow-2xl flex flex-col">
        
        <!-- Header -->
        <div class="bg-indigo-900 p-4 pt-8 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-white">ශ්‍රී ලංකා 2027 නිවාඩු</h1>
            <p class="text-xs text-indigo-200 mt-1">Sri Lanka 2027 Holiday Calendar</p>
            
            <!-- Search & Toggle Tabs -->
            <div class="mt-3 space-y-2">
                <input type="text" id="searchInput" placeholder="🔍 නිවාඩු දිනයක් සොයන්න..." 
                    class="w-full bg-indigo-950 text-white text-sm px-3 py-2 rounded-lg border border-indigo-700 focus:outline-none focus:border-white">
                
                <div class="flex bg-indigo-950 p-1 rounded-lg border border-indigo-800 text-xs">
                    <button id="tabList" onclick="switchTab('list')" class="flex-1 py-1.5 rounded-md font-semibold bg-indigo-600 text-white transition">නිවාඩු ලැයිස්තුව</button>
                    <button id="tabCal" onclick="switchTab('cal')" class="flex-1 py-1.5 rounded-md font-semibold text-indigo-300 transition">මාසික දර්ශනය</button>
                </div>
            </div>
        </div>

        <!-- Notice -->
        <div class="p-3 bg-amber-950 border-b border-amber-800 text-amber-200 text-xs font-medium">
            ⚠️ සියලුම සෙනසුරාදා සහ ඉරිදා දිනයන් බැංකු නිවාඩු (B) ලෙස සැලකේ.
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto p-3 pb-6">
            <!-- List View -->
            <div id="listView" class="space-y-2.5"></div>

            <!-- Calendar View -->
            <div id="calView" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <button onclick="changeMonth(-1)" class="bg-indigo-900 px-3 py-1 rounded-lg text-sm font-bold">&larr; පෙර</button>
                    <h2 id="monthTitle" class="text-base font-bold text-indigo-300">January 2027</h2>
                    <button onclick="changeMonth(1)" class="bg-indigo-900 px-3 py-1 rounded-lg text-sm font-bold">ඊළඟ &rarr;</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 font-semibold mb-1">
                    <span class="text-red-400">Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span class="text-red-400">Sat</span>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
            </div>
        </div>

        <!-- Modal for Day Details -->
        <div id="detailModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
                <h3 id="modalDate" class="text-sm font-semibold text-indigo-400 mb-1"></h3>
                <h2 id="modalTitle" class="text-lg font-bold text-white mb-2"></h2>
                <p id="modalSi" class="text-sm text-slate-300 mb-4"></p>
                <div id="modalBadges" class="flex gap-2 mb-6"></div>
                <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm">වසන්න (Close)</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-900 border-t border-slate-800 p-2 text-center text-[11px] text-slate-400">
            B: Bank | P: Public | M: Mercantile
        </div>
    </div>

    <!-- Link external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
